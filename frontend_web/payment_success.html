<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - Portal de Movilidad</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 40px;
            background-color: var(--white);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-message">Procesando su compra...</h1>
        <p id="sub-message">Por favor, espere un momento mientras activamos su plan.</p>
        <div id="result-message"></div>
        <br>
        <a href="/" class="cta-button">Volver a la página principal</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const mainMessage = document.getElementById('main-message');
            const subMessage = document.getElementById('sub-message');
            const resultMessage = document.getElementById('result-message');

            const params = new URLSearchParams(window.location.search);
            const paymentType = params.get('type');

            let payload = {};
            let successMessage = "";
            let successSubMessage = "";
            let resultHtml = "";

            if (paymentType === 'fine') {
                const fineId = params.get('fine_id');
                if (!fineId) {
                    mainMessage.textContent = "Error en el Pago";
                    subMessage.textContent = "No se encontró la información de la multa.";
                    return;
                }
                payload = { event_type: 'fine_payment_succeeded', fine_id: parseInt(fineId) };
                successMessage = "¡Pago de Multa Exitoso!";
                successSubMessage = "Gracias. El pago de su multa ha sido registrado.";
                resultHtml = `<p>ID de Multa: <strong>${fineId}</strong></p>`;

            } else { // Default to subscription payment
                const planId = params.get('plan_id');
                const entidadId = params.get('entidad_id');
                if (!planId || !entidadId) {
                    mainMessage.textContent = "Error en la Compra";
                    subMessage.textContent = "No se encontró la información del plan.";
                    return;
                }
                payload = { event_type: 'subscription_payment_succeeded', plan_id: planId, entidad_id: entidadId };
                successMessage = "¡Suscripción Exitosa!";
                successSubMessage = "Gracias por su compra. Su plan ha sido activado.";
                resultHtml = `<p>Plan: <strong>${planId}</strong></p><p>Entidad: <strong>${entidadId}</strong></p>`;
            }

            // This simulates the payment provider's webhook call.
            try {
                const response = await fetch('/api/v1/payments/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'La confirmación del pago falló.');
                }

                const result = await response.json();
                console.log("Webhook simulation result:", result);

                mainMessage.textContent = successMessage;
                subMessage.textContent = successSubMessage;
                resultMessage.innerHTML = resultHtml;

            } catch (error) {
                console.error("Error processing payment confirmation:", error);
                mainMessage.textContent = "Error en la Confirmación";
                subMessage.textContent = `Hubo un problema al confirmar su pago. Por favor, contacte a soporte. (${error.message})`;
            }
        });
    </script>

</body>
</html>
